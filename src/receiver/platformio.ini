[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
framework = arduino
lib_deps =
  FastLED

[env:esp32-s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
lib_deps =
  fastled/FastLED@3.10.3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  FastLED
